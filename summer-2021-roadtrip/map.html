<html>
<head>
  <title>Road Trip 2021</title>

  <link rel="stylesheet" href="styling.scss"/>
  <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">  <script src="http://cdn.leafletjs.com/leaflet-0.7.3/leaflet.js"></script>

  <style>
  #map{ width: 60%; height: 80%; }

</head>

<body>
  <div id="map"></div>

<script type="module">
    import { locations } from './assets/locations.js';
    console.log(locations);

  // initialize the map
  var map = L.map('map').setView([42.35, -71.08], 3);

  // load a tile layer
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

 //   const tripPoints = createTripPointsGeoJson({ locations });
    const tripPoints = $.getJSON("./assets/tripPoints.geojson",function(data){
      
    // add GeoJSON layer to the map once the file is loaded
    L.geoJson(data).addTo(map);
  });
    console.log("Trip Points", tripPoints)
   
   // const tripLines = createTripLinesGeoJson({ locations });
   const tripLines = $.getJSON("./assets/tripLines.geojson",function(data){
    // add GeoJSON layer to the map once the file is loaded
    L.geoJson(data).addTo(map);
  });    console.log("Trip Lines", tripPoints)


    // create "pins" and lines from destination A to B
    const tripPointsGeoJsonLayers = new L.geoJson(tripPoints, {
       pointToLayer: tripStopPointToLayer
     });
     const tripLinesGeoJsonLayers = new L.geoJson(tripLines);

    // draw pins and lines on map
    tripPointsGeoJsonLayers.addTo(map);
    tripLinesGeoJsonLayers.addTo(map);

    //const bounds = tripPointsGeoJsonLayers.getBounds();
   // map.fitBounds(bounds);


  // load GeoJSON from an external file
  

  /**
   * createTripLinesGeoJson
   */
  
   function createTripLinesGeoJson({ locations } = {}) {
    return {
      "type": "FeatureCollection",
      "features": locations.map((stop = {}, index) => {
        const prevStop = locations[index - 1];
  
        if ( !prevStop ) return [];
  
        const { placename, location = {}, date, todo = [] } = stop;
        const { lat, lng } = location;
        const properties = {
          placename,
          todo,
          date
        };
  
        const { location: prevLocation = {} } = prevStop;
        const { lat: prevLat, lng: prevLng } = prevLocation;
  
        return {
          type: 'Feature',
          properties,
          geometry: {
            type: 'LineString',
            coordinates: [
              [ prevLng, prevLat ],
              [ lng, lat ]
            ]
          }
        }
      })
    }
  }

/**
 * tripStopPointToLayer
 */

function tripStopPointToLayer( feature = {}, latlng ) {
  const { properties = {} } = feature;
  const { placename, todo = [], image, date } = properties;

  const list = todo.map(what => `<li>${ what }</li>`);
  let listString = '';
  let imageString = '';

  if ( Array.isArray(list) && list.length > 0 ) {
    listString = list.join('');
    listString = `
      <p>Things we will or have done...</p>
      <ul>${listString}</ul>
    `
  }

  if ( image ) {
    imageString = `
      <span class="trip-stop-image" style="background-image: url(${image})">${placename}</span>
    `;
  }

  const text = `
    <div class="trip-stop">
      ${ imageString }
      <div class="trip-stop-content">
        <h2>${placename}</h2>
        <p class="trip-stop-date">${date}</p>
        ${ listString }
      </div>
    </div>
  `;

  const popup = L.popup({
    maxWidth: 400
  }).setContent(text);

  const layer = L.marker( latlng, {
    // icon: L.divIcon({
    //   className: 'icon',
    //   html: `<span class="icon-trip-stop"></span>`,
    //   iconSize: 20
    // }),
    icon: L.icon({
    className: 'icon',
    html: `<span class="icon-trip-stop"></span>`,
    iconUrl: 'lyft-car.png',
    iconSize: [50,40]
  }),

    riseOnHover: true
  }).bindPopup(popup);

  return layer;
}
 
  </script>
</body>
</html>
